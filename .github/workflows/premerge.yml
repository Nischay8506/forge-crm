# Pre-merge checks on every push and pull request: the migration owner rule, one
# migration head, then both test suites on a fresh database. Same script as on a PC:
# scripts/premerge_check.py. No secrets are needed; tests/conftest.py uses test-only keys.
name: Pre-merge checks

on:
  push:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      # Who may add or change files in backend/alembic/versions (comma-separated logins).
      MIGRATION_OWNERS: ${{ vars.MIGRATION_OWNERS || 'Nischay8506' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration owner and one head
        env:
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          # A push to main is compared with what main was before it; anything else with main.
          BASE: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || 'origin/main' }}
        run: python3 scripts/premerge_check.py --base "$BASE" --actor "$ACTOR"

      - name: Create the databases (as infra/postgres-init.sql does locally)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/postgres-init.sql

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci

      - name: Backend tests (migrates forge_test from empty first)
        working-directory: backend
        run: uv run pytest -q

      - name: Frontend tests
        working-directory: frontend
        run: npm test
