[project]
name = "forge-crm-backend"
version = "0.1.0"
description = "Forge CRM backend: FastAPI services, agent runtime and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "rapidfuzz>=3.14.6",
    "jellyfish>=1.2.1",
    "phonenumbers>=9.0.40",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.0",
    "cryptography>=44",
    "mcp>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# FastAPI uses Depends(...) in argument defaults by design.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "app.core.deps.require_permission"]
